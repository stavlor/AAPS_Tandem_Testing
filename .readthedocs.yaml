# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs_src/conf.py
  # Same strictness as the GitHub Actions build: broken links or missing
  # images fail the build instead of publishing a broken page.
  fail_on_warning: true

python:
  install:
    - requirements: docs_src/requirements.txt
