name: Documentation

# Builds the Sphinx docs in docs_src/ and publishes them to GitHub Pages of
# whichever repo runs it: https://<owner>.github.io/<repo>/
#   - andyrozman/AAPS_Tandem_Testing -> the main docs (same address as the old
#     hand-written docs, which this replaces)
#   - a fork, e.g. stavlor/AAPS_Tandem_Testing -> a work-in-progress preview
#
# One-time setup in each repo: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". In a fork, also enable workflows on the Actions tab.
# Pages only deploys from branches allowed in Settings -> Environments ->
# github-pages (by default, the default branch). To publish another branch, add
# it there, or run this workflow by hand on that branch (Actions -> Run workflow).

on:
  push:
    # testing_v4: temporary, for the work-in-progress preview on a fork.
    # Remove before merging upstream.
    branches: [testing, testing_v4]
    paths:
      - "docs_src/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs_src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; don't cancel a deploy that is already running.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs_src/requirements.txt

      - name: Install Sphinx
        run: pip install -r docs_src/requirements.txt

      # Gives the site's public URL (custom domain aware) for canonical links.
      # Skipped on pull requests, which are only built, not published.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build HTML
        env:
          DOCS_BASEURL: ${{ steps.pages.outputs.base_url }}
          DOCS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: sphinx-build -W --keep-going -b html docs_src _build/html

      - name: Check GitHub Pages output
        run: |
          test -f _build/html/.nojekyll || { echo "::error::.nojekyll missing"; exit 1; }
          test -f _build/html/index_phase_1.html || { echo "::error::legacy redirect missing"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
