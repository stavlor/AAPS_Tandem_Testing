name: Documentation

on:
  push:
    branches: [testing]
    paths:
      - "docs_src/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs_src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs_src/requirements.txt

      - name: Install Sphinx
        run: pip install -r docs_src/requirements.txt

      - name: Build HTML
        run: sphinx-build -W --keep-going -b html docs_src _build/html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
